# laarma 静的ポリシー定義ファイル
#
# laarma_sdk の PolicyEngine に読み込まれ、静的ゲートとして機能する。
# load_policy() でこのファイルを読み込み AARMRuntime に渡す。
#
# キー説明:
#   denied_tools    : 絶対禁止ツール。呼び出されると即 DENY。
#   required_params : ツールごとの必須パラメータ。不足時は DEFER。
#   max_actions     : セッション内の最大アクション数。超過時は DENY。
#   rules           : 追加の静的ルール（順番に評価、最初にマッチしたものを適用）。
#   evaluation      : IntentAlignment へ渡す評価パラメータ。

denied_tools:
  - drop_database
  - delete_all_records
  - exfiltrate_data
  - disable_logging

required_params:
  write_file:
    - path
    - content
  delete_file:
    - path
  send_email:
    - to
    - subject
    - body

max_actions: 50

# 静的ルール（PolicyEngine が順番に評価）
# 【注記】これらは AARM 仕様外のドメイン固有ルール（試作上の妥協）。
# path パターンマッチングなどの決定論的変換を PolicyEngine に委ねることで
# IntentAlignment を純粋な AARM 意図整合性評価に特化させている。
rules:
  - id: unsafe_write_path
    decision: MODIFY
    reason: "危険な書き込み先 '{path}' を安全なパスに書き換えました。"
    conditions:
      tool: write_file
      param_matches:
        path: '^/|\.\.'
    modify_transform:
      path: basename  # _TRANSFORM_REGISTRY のキー: "basename" → os.path.basename

  - id: deny_critical_file_delete_in_prod
    decision: DENY
    reason: "本番環境の重要ファイル（設定・DB・ログ）の削除は禁止されています。"
    conditions:
      tool: delete_file
      environment_type: production
      any_of:
        - param_matches:
            path: '\.(conf|config|log|db|sqlite)$'
        - param_matches:
            path: 'database'

  - id: production_delete_defer
    decision: DEFER
    reason: "本番環境かつメンテナンス窓外での削除操作のため、追加の実行トレース検証が必要です（一時保留）。"
    conditions:
      tool: delete_file
      environment_type: production
      not_in_maintenance_window: true
      none_of:                          # 重要ファイルは deny_critical_file_delete_in_prod が担当
        - param_matches:
            path: '\.(conf|config|log|db|sqlite)$'
        - param_matches:
            path: 'database'

# データ分類キーワード（省略するとデフォルト値を使用）
data_classification:
  pii_keywords:
    - email
    - email_address
    - phone
    - phone_number
    - address
    - ssn
    - credit
    - customer
    - personal
    - name
    - info
  confidential_keywords:
    - secret
    - token
    - key
    - credential
    - private
    - internal
    - config
  sensitive_tools:
    - database
    - db
    - execute_shell
    - execute_sql
  destructive_tools:
    - delete_file
    - drop_database
    - delete_all_records
    - execute_shell

