# laarma 静的ポリシー定義ファイル
#
# laarma_sdk の PolicyEngine に読み込まれ、静的ゲートとして機能する。
# load_policy() でこのファイルを読み込み AARMRuntime に渡す。
#
# キー説明:
#   denied_tools    : 絶対禁止ツール。呼び出されると即 DENY。
#   max_actions     : セッション内の最大アクション数。超過時は DENY。
#   rules           : 追加の静的ルール（全マッチを収集し、最も高い priority のルールを適用。
#                     同一 priority で decision が競合する場合は DEFER）。
#
# priority 帯（#129 で確定。安全序列 DENY > DEFER > STEP_UP > MODIFY > ALLOW を priority の
# 大小に対応させる。異なる decision は異なる帯に置く——同一 priority で decision が割れると
# R3(b) の competition で terminal DEFER に落ちるため）:
#   1000       Forbidden（δ 非参照の静的 DENY・不可侵最上位）
#    900       意図整合性 DENY（semantic_distance 参照）
#    800       文脈依存 DENY（組織固有 DENY 用に予約・現状該当ルールなし）
#    700 番台  DEFER（700=confidence 包括土台、710 以上=カスタム DEFER の詳細化・穴あけ）
#    600       STEP_UP
#    500       MODIFY
#    100       ctx-ALLOW（#139 の明示 ALLOW ルール用）
#      0       baseline（priority 無指定のルールの既定値）

denied_tools:
  - drop_database
  - delete_all_records
  - exfiltrate_data
  - disable_logging

max_actions: 50

# データ分類キーワード（省略するとデフォルト値を使用）
data_classification:
  pii_keywords:
    - email
    - email_address
    - phone
    - phone_number
    - address
    - ssn
    - credit
    - customer
    - personal
    - name
    - info
  confidential_keywords:
    - secret
    - token
    - key
    - credential
    - private
    - internal
    - config

# ツール分類（性質による分類。データの機密度とは別軸のため data_classification と分離。
# 省略するとデフォルト値を使用）
# rules: 側で &destructive_tools を参照するため、rules: より前で定義する（YAML のエイリアスは
# 文書内で先に出現したアンカーしか解決できない）。
tool_classification:
  sensitive_tools:
    - database
    - db
    - execute_shell
    - execute_sql
  destructive_tools: &destructive_tools
    - delete_file
    - drop_database
    - delete_all_records
    - execute_shell
  external_tools:
    - send_email
    - http_request
    - webhook
    - slack_message

# 静的ルール（PolicyEngine が全マッチを収集し priority で解決する）
# 【注記】これらは AARM 仕様外のドメイン固有ルール（試作上の妥協）。
# path パターンマッチングなどの決定論的変換を PolicyEngine に委ねている。
rules:
  - id: unsafe_write_path
    decision: MODIFY
    priority: 500
    reason: "危険な書き込み先 '{path}' を安全なパスに書き換えました。"
    conditions:
      tool: write_file
      param_matches:
        path: '^/|\.\.'
    modify_transform:
      path: basename  # _TRANSFORM_REGISTRY のキー: "basename" → os.path.basename

  - id: deny_critical_file_delete_in_prod
    decision: DENY
    priority: 1000
    reason: "本番環境の重要ファイル（設定・DB・ログ）の削除は禁止されています。"
    conditions:
      tool: delete_file
      environment_type: production
      any_of:
        - param_matches:
            path: '\.(conf|config|log|db|sqlite)$'
        - param_matches:
            path: 'database'

  - id: production_delete_defer
    decision: DEFER
    priority: 710
    reason: "本番環境かつメンテナンス窓外での削除操作のため、追加の実行トレース検証が必要です（一時保留）。"
    conditions:
      tool: delete_file
      environment_type: production
      not_in_maintenance_window: true
      none_of:                          # 重要ファイルは deny_critical_file_delete_in_prod が担当
        - param_matches:
            path: '\.(conf|config|log|db|sqlite)$'
        - param_matches:
            path: 'database'

  # 条件1（write/delete への意図矛盾/無相関）の write_file 抜けの補完を、条件2 の破壊/書込への
  # 具体化として吸収する（#142）。AND ゲート（action_matches_intent=false かつ
  # semantic_distance>0.4）を原文どおり復元し、対象を delete_file 限定から destructive_tools/
  # write_file へ拡張。旧 deny_intent_mismatch_delete の distance>0.64 単独条件は、AND ゲートを
  # 落とした代償に閾値を吊り上げた歪曲値（原文にない）だったため置換する。
  #
  # 曖昧削除（「古いファイルを整理して不要なものを削除してくれ」等）もこの AND ゲートに該当し
  # DENY に倒れる。これは字義どおり移植した帰結として確定した設計判断（#142）——旧ルールの
  # distance>0.64 のもとで DEFER 期待になっていた benchmark ケースは、AND ゲートを落とした
  # 歪曲の産物であり、変化前の期待値を維持する理由にはしない。
  - id: deny_intent_mismatch_destructive   # 旧 deny_intent_mismatch_delete を置換
    decision: DENY
    reason: "ユーザーの意図から乖離した破壊/書込操作 '{path}' を検出したため拒否しました。"
    priority: 900
    conditions:
      any_of:
        - tool: *destructive_tools
        - tool: write_file
      context:
        action_matches_intent: false
        semantic_distance:
          gt: 0.4

  # scope_expansion（想定スコープ外のツールへの、このアクションによるアクセス）かつ
  # action_matches_intent=false（要求がそのツール/対象を明示参照しない＝意図での正当化がない）を
  # 検出したら DENY する（条件3、#142）。原文の "no justification in user_intent" を
  # action_matches_intent=false で近似する暫定移植（scope_expansion の産出自体の本格的な
  # 再設計は #99）。当該アクション時点の scope_expansion を参照する（累積の
  # scope_expansion_detected ではない）——累積を使うと、一度スコープ外アクセスが起きたセッション
  # では以降無関係なアクションまで DENY し続ける取り違えになる（#143 と同型のバグ、#156 で是正）。
  # semantic_distance は絡めない（条件2 と異なり、意図整合の信号同士の掛け合わせに留める）。
  # tool は非限定（external_tools に限らず scope_expansion を見るツール全般が対象）。
  - id: deny_scope_expansion_unjustified
    decision: DENY
    priority: 900
    reason: "ユーザーの意図で正当化されないスコープ外アクセスを検出したため拒否しました。"
    conditions:
      context:
        scope_expansion: true
        action_matches_intent: false

  # 本番環境での破壊的操作を STEP_UP する（条件14、#142）。「十分な文脈はあるが残余リスクがある」
  # （原文 with sufficient context but remaining risk）は DEFER でなく STEP_UP を選ぶ理由の説明であり
  # 条件には書かない。本番の delete_file は既に2ルールが覆っている
  # （重要ファイル→ deny_critical_file_delete_in_prod(DENY・1000)、メンテ窓外→
  # production_delete_defer(DEFER・710)）ため、本ルールが実際に効くのは「本番かつメンテナンス窓内
  # かつ重要ファイル以外」の領域——従来は素通り（baseline ALLOW）だった穴を埋める。
  - id: step_up_production_destructive
    decision: STEP_UP
    priority: 600
    reason: "本番環境での破壊的操作 '{path}' には追加確認が必要です。"
    conditions:
      tool: *destructive_tools
      environment_type: production

  # 当該ファイル（現時点のアクション）が PII/CONFIDENTIAL かどうかを見る。累積
  # cumulative_data_classification ではなく当該アクション時点の data_classification を参照する
  # (#143・#156)。累積を使うと、セッション内で先に PII に触れた後は PII と無関係なファイルの削除にも
  # STEP_UP してしまう（reason が主張する判定根拠と実際の判定根拠が食い違う）。
  - id: step_up_pii_delete
    decision: STEP_UP
    reason: "PII/CONFIDENTIAL を含む可能性のあるファイル '{path}' の削除には追加確認が必要です。"
    priority: 600
    conditions:
      tool: delete_file
      any_of:
        - context:
            data_classification:
              contains: PII
        - context:
            data_classification:
              contains: CONFIDENTIAL

  # 機微データ（PII/CONFIDENTIAL）への read を STEP_UP する（条件13「significant access」側、#142）。
  # list_files は含めない（ディレクトリ一覧は PUBLIC）。action_matches_intent は条件に書かない
  # （原文 "even with explicit user intent" — 明示意図があっても STEP_UP。意図一致は ALLOW 帯(100)
  # の allow_information_gathering 等を発火させうるが、本ルールが STEP_UP 帯(600)で上回る）。
  - id: step_up_sensitive_read
    decision: STEP_UP
    priority: 600
    reason: "機微データを含む可能性のあるファイル '{path}' の読み出しには追加確認が必要です。"
    conditions:
      tool: read_file
      any_of:
        - context:
            data_classification:
              contains: PII
        - context:
            data_classification:
              contains: CONFIDENTIAL

  # confidence_level（evaluability）参照ルール（条件10・15の移行、#112 Phase B3・Phase C）。
  # ツール限定はしない（confidence は distance と異なり危険性軸ではなく評価可能性の軸のため、
  # 破壊的操作に絞る理由がない）。priority は帯（#129）に従い、defer_low_confidence=700（DEFER 帯）・
  # step_up_low_confidence=600（STEP_UP 帯）。安全序列 DEFER > STEP_UP により、両者が同時発火する
  # ことはない（confidence_level の区間 lte:0.4 と gt:0.4,lt:0.6 が排他）が、他 decision のルールと
  # 重なった場合も帯の上下で解決され、同一 priority 競合による DEFER 落ちは生じない。
  #
  # 決定論項（distance × 0.3 の減点 + scope_expansion 0.25 の減点）だけでは confidence の下限が
  # 0.45 に留まり defer_low_confidence（条件10）は発火しない。confidence_llm.py の LLM 検出層
  # （#112 Phase C）が意味論的な曖昧さ・矛盾（「古いファイル」等）を検出して追加減点することで
  # 初めて 0.4 以下に到達しうる（docs/design/decision-layer-policy-engine.md §5）。
  - id: step_up_low_confidence
    decision: STEP_UP
    priority: 600
    reason: "アクションの評価確信度が低いため、追加確認が必要です。"
    conditions:
      context:
        confidence_level:
          gt: 0.4
          lt: 0.6

  # 境界 0.4 は本ルール（lte）が一意に拾う。step_up_low_confidence は gt: 0.4 で 0.4 を含まない
  # ため、0.4 ちょうどが両ルールの間で未発火（fail-open）に落ちる穴を作らない。
  - id: defer_low_confidence
    decision: DEFER
    priority: 700
    reason: "アクションの評価確信度が著しく低いため、実行を保留します。"
    conditions:
      context:
        confidence_level:
          lte: 0.4

  # 情報収集系は全体の意図が曖昧でも ALLOW する（条件12前半、#142・#139）。意図の曖昧さ
  # （semantic_distance/confidence_level）は条件に書かない。上位帯（DENY/DEFER/STEP_UP）が
  # 発火すればそちらが勝つ——機微データ（PII/CONFIDENTIAL）を含む read_file は
  # step_up_sensitive_read（600）が本ルール（130）に優先し STEP_UP になる。
  #
  # priority 130 は ctx-ALLOW 帯（100番台、#129）内の細分化（#142 パス2 総点検）。より具体的で
  # 情報量の多い許可理由が優先して出るよう並べる: 140=allow_destructive_explicit_high_confidence
  # （条件8）/ 130=allow_action_matches_intent（条件5）・allow_information_gathering（条件12前半）
  # / 120=allow_low_semantic_distance（条件6）/ 110=allow_no_sensitive_data（条件7）。条件7
  # 「機微データが関与しない」はほぼ全アクションにマッチする最も消極的な理由のため最下位に置く。
  # 100 のまま条件7 を後から追加すると 110 が本ルールを上回り reason の優先順位が反転するため、
  # 条件7 実装前の本ルール単独導入の時点で先に 130 を割り当てておく。
  - id: allow_information_gathering
    decision: ALLOW
    priority: 130                 # ctx-ALLOW 帯（#129）内の細分化（#142 パス2）
    reason: "情報収集系の操作のため許可します。"
    conditions:
      any_of:
        - tool: read_file
        - tool: list_files

  # 条件5〜8（ALLOW、#142）。#139 で「baseline ALLOW で自然に出るから専用ルール不要」という判断を
  # 明示的に退けたため、baseline と同じ decision（ALLOW）でも意図された許可として明示ルール化する
  # （非重複の検証・監査可能性・将来のルール追加との衝突検知が baseline のままでは得られない）。
  # priority は 100番台の細分化（140/130/120/110）で、より具体的で情報量の多い許可理由が優先して
  # 出るよう並べる。いずれも ctx-ALLOW 帯のため、上位の DENY/DEFER/STEP_UP/MODIFY を握り潰す
  # fail-open にはならない。

  # 条件8: destructive かつ明示意図かつ高 confidence。条件5 の部分集合だが、「条件5に吸収されるから
  # 不要」は #139 が退けた baseline 論法と同型のため独自ルールとして起こす。gte:0.6 は
  # step_up_low_confidence（0.4<confidence<0.6）の上に接続する暫定閾値。
  - id: allow_destructive_explicit_high_confidence
    decision: ALLOW
    priority: 140
    reason: "破壊的操作だが、明示的な意図と高い確信度があるため許可します。"
    conditions:
      tool: *destructive_tools
      context:
        action_matches_intent: true
        confidence_level:
          gte: 0.6

  # 条件5: 意図一致（原文の OR 後半「要求が対象を明示的に言及」は action_matches_intent の定義
  # そのものなので前半に吸収）。
  - id: allow_action_matches_intent
    decision: ALLOW
    priority: 130
    reason: "アクションがユーザーの意図に合致しているため許可します。"
    conditions:
      context:
        action_matches_intent: true

  # 条件6: 意味的距離が小さい。条件2（distance>0.4 の DENY）との間の 0.3〜0.4 は明示基準なしで
  # 空ける（原設計もこの帯に基準を持たない。閾値の是非は条件2／整合信号 #128 側の論点）。
  - id: allow_low_semantic_distance
    decision: ALLOW
    priority: 120
    reason: "アクションとユーザー意図の意味的距離が小さいため許可します。"
    conditions:
      context:
        semantic_distance:
          lt: 0.3

  # 条件7: 当該アクションが機微データ（PII/CONFIDENTIAL）を扱わない。原文 "in the action" に従い
  # 当該アクション時点の data_classification を参照する。累積 cumulative_data_classification では
  # ない——#143 の判断軸（当該アクションの性質を見るルールには当該アクション時点の値、セッションを
  # 跨ぐ文脈には累積）を踏襲する（#156）。当該アクション時点の値を使うことで、条件13
  # （step_up_pii_delete/step_up_sensitive_read、同じく当該アクション時点の data_classification
  # 参照）と論理的に相補になる（条件13 が発火しないケースを条件7 が拾う）。reason は当該アクション
  # 限定の表現にする（セッション全体で機微データ不関与、と誤読されないように。#143 で問題視した
  # 「reason が主張する判定根拠と実態の食い違い」を繰り返さない）。
  - id: allow_no_sensitive_data
    decision: ALLOW
    priority: 110
    reason: "このアクションは機微データ（PII/CONFIDENTIAL）を扱わないため許可します。"
    conditions:
      none_of:
        - context:
            data_classification:
              contains: PII
        - context:
            data_classification:
              contains: CONFIDENTIAL
