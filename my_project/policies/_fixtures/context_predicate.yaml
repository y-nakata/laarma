# テスト専用フィクスチャ: context.<signal> 述語評価（δ 参照の共通機構、#112 Phase B0）の
# 疎通確認用。
#
# benchmark_data.jsonl の context_predicate_* のみが policy_file 経由でこのファイルをロードする。
# 配布用 my_project/policies/policy.yaml にはテスト専用ルールを混在させない。
#
# 各シグナルについて「発火するケース」と「発火しないケース」を対で用意し、述語評価器が
# 実際に動作していることを decision の差で確認できるようにする。

rules:
  # 集合演算子 contains（data_classification 向け）。値は read_file の path パラメータに
  # PII キーワードが含まれるかどうかで決定論的に決まる（embedding モデル不要）。
  - id: _test_context_data_classification_pii
    decision: DENY
    reason: "テスト専用: context.data_classification contains PII の発火確認。"
    priority: 5
    conditions:
      tool: read_file
      context:
        data_classification:
          contains: PII

  # 集合演算子 contains（cumulative_data_classification 向け、#156）。derived_signals()（δn）と
  # cumulative_signals() を PolicyEngine.evaluate() がマージしてから条件評価に渡す配線の疎通確認。
  # 当該アクション自体は PII と無関係でも、セッション内の先行アクセスで累積 PII が立っていれば発火する
  # （data_classification=当該アクション時点のみ、では拾えないことも併せて確認する）。
  - id: _test_context_cumulative_data_classification_pii
    decision: DENY
    reason: "テスト専用: context.cumulative_data_classification contains PII の発火確認。"
    priority: 5
    conditions:
      tool: list_files
      context:
        cumulative_data_classification:
          contains: PII

  # 数値演算子 lte（confidence_level 向け）。テスト用アクション（list_files, intent="何か手伝えることある？"）
  # の confidence_level 実測値は概ね 0.71（benchmark --verbose で確認）。0.0/1.0 の端に張り付かない
  # 中間値のため、その両側に十分なマージン（約 0.14〜0.16）を取った閾値で発火/不発火の差が数値比較の
  # 結果からのみ生まれるようにする。not-fires 側の対となるルールは
  # `_fixtures/context_predicate_confidence_not_fires.yaml` に分離する（同一 tool・同一アクションに
  # 対して閾値だけを変え、tool を変えて誤魔化さない）。
  - id: _test_context_confidence_fires
    decision: DENY
    reason: "テスト専用: context.confidence_level lte 0.85 の発火確認（実測値 約0.71 を含む閾値）。"
    priority: 5
    conditions:
      tool: list_files
      context:
        confidence_level:
          lte: 0.85
