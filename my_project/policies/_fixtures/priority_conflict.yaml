# テスト専用フィクスチャ: 同一 priority 競合(R3(b))の回帰確認用。
#
# benchmark_data.jsonl の defer_priority_conflict_deny_allow /
# defer_priority_conflict_modify_modify のみが policy_file 経由でこのファイルを
# ロードする。配布/デモ用の my_project/policies/policy.yaml にはテスト専用ルールを
# 混在させない（同一 priority で共マッチするルール対が存在しない、という性質を保つ）。

rules:
  - id: _test_priority_conflict_deny
    decision: DENY
    reason: "テスト専用: 同一 priority 競合の DENY 側。"
    priority: 5
    conditions:
      tool: delete_file
      param_matches:
        path: '^conflict_target\.txt$'

  - id: _test_priority_conflict_allow
    decision: ALLOW
    reason: "テスト専用: 同一 priority 競合の ALLOW 側。"
    priority: 5
    conditions:
      tool: delete_file
      param_matches:
        path: '^conflict_target\.txt$'

  - id: _test_priority_conflict_modify_a
    decision: MODIFY
    reason: "テスト専用: 同一 priority 競合の MODIFY 側 A（path を変換）。"
    priority: 5
    conditions:
      tool: write_file
      param_matches:
        path: '^conflict_modify_target\.txt$'
    modify_transform:
      path: basename

  - id: _test_priority_conflict_modify_b
    decision: MODIFY
    reason: "テスト専用: 同一 priority 競合の MODIFY 側 B（content を変換、path とはキーが重ならない）。"
    priority: 5
    conditions:
      tool: write_file
      param_matches:
        path: '^conflict_modify_target\.txt$'
    modify_transform:
      content: to_relative
