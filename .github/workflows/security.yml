name: Security Scan

# laarma はパブリックリポジトリのため、外部コントリビューターのフォークPRでも
# 安全に動くよう設計している:
#   - permissions は読み取り専用（contents: read）
#   - 自前のシークレットは一切渡さない（使うのは GitHub 自動発行の一時 GITHUB_TOKEN のみ）
#   - サードパーティ Action はコミット SHA でピン留め（タグは可変なため）
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 00:00 UTC に定期実行（新規公表された依存脆弱性の検知用）

permissions:
  contents: read

jobs:
  # コード・git 履歴に誤ってコミットされたシークレット（APIキー等）を検出
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0   # 履歴全体を取得して過去コミットも走査する
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 依存ライブラリの既知脆弱性を検出
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ./laarma_sdk
      - run: pip install pip-audit
      # CVE-2025-3000 を除外する理由:
      #   - 実体は PyTorch issue #149623（自作 jit クラスのコンパイル時 Segmentation Fault）を
      #     第三者DB(vuldb)が機械的に CVE 化したもの。PyTorch 本体はセキュリティ問題として扱っておらず
      #     （module: crash ラベルのみ・修正版なし・Open のまま）、CVE も PyTorch 発番ではない。
      #   - 攻撃経路は「自分で書いた torch.jit.script コードを自分でコンパイルしてクラッシュ」に限定され、
      #     外部入力による攻撃ベクタではない（CVSS は各機関評価で Medium）。
      #   - laarma は torch.jit.script を一切使用していない（torch は embedding 計算のみに利用）。
      #   - 修正版が公表されておらず、torch をアップグレードしても警告は解消しない。
      - run: pip-audit --desc --ignore-vuln CVE-2025-3000
      
  # 自作 Python コードの危険なパターンを静的解析
  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - run: pip install bandit
      - run: bandit -r laarma_sdk/src my_project -ll   # -ll = MEDIUM 以上の深刻度のみ報告
